[package]
name = "qwen3.5"
version = "1.0.0"
description = "Port do Qwen3.5-2B: texto, imagem, tokenizer BPE e geracao em stream"

[entrypoint]
package = "qwen3.5"

[dependencies]
quantizations = { git = "https://github.com/useplx/Quantizations.git", version = "v1.0.0" }

[myelin]
formats = ["f32", "bf16"]

[policies."model"]
dtype = "f16"

[policies."model".backend]
device = "local"
ordinal = 0

[policies."model".backend.flags]
iree-hal-target-device = "cuda"

[[policies."model".schemes]]
format = "f16"
volatile = true

# Q8 avoids sub-byte gathers in the tied embedding/LM-head weight, which keeps
# the artifact legal for CUDA while remaining substantially smaller than F16.
[[policies."model.language_model.embed_tokens.weight".schemes]]
format = "q8"

# Q4 affine G32 remains on bandwidth-dominant projection matrices. Norms,
# recurrent state, biases and other small/sensitive tensors inherit F16.

[[policies."model.language_model.layers.*.self_attn.q_proj.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.self_attn.k_proj.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.self_attn.v_proj.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.self_attn.o_proj.weight".schemes]]
format = "q4k"

[[policies."model.language_model.layers.*.linear_attn.in_proj_qkv.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.linear_attn.in_proj_z.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.linear_attn.in_proj_b.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.linear_attn.in_proj_a.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.linear_attn.out_proj.weight".schemes]]
format = "q4k"

[[policies."model.language_model.layers.*.mlp.gate_proj.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.mlp.up_proj.weight".schemes]]
format = "q4k"
[[policies."model.language_model.layers.*.mlp.down_proj.weight".schemes]]
format = "q4k"

[weights]
path = "checkpoints/Qwen3.5-2B/model.safetensors-00001-of-00001.safetensors"

[build.graph]
namespace = "qwen3vl"
toolchain = "cpp"
sources = [
    "src/qwen3_vl/package.cpp",
    "src/qwen3_vl/nn",
]
exports = ["decoder", "prefill"]

[build.orchestration]
toolchain = "cpp"
sources = [
    "src/qwen3_vl/entrypoint.cpp",
    "src/qwen3_vl/orchestration.cpp",
    "src/qwen3_vl/model.cpp",
    "src/qwen3_vl/rope.cpp",
    "src/qwen3_vl/nn",
]

[build.native]
toolchain = "cpp"
sources = [
    "src/qwen3_vl/tokenizer_native.cpp",
    "src/qwen3_vl/tokenizer.cpp",
    "src/qwen3_vl/vision_native.cpp",
]
includes = ["=/usr/include/opencv4"]
libraries = [
    "pcre2-8",
    "utf8proc",
    "opencv_imgcodecs",
    "opencv_imgproc",
    "opencv_core",
]

[capabilities]
provides = ["generator", "multimodal-generator"]

[package.variables]
context = { type = "uint32", default = 1024, define = "QWEN3VL_MAX_SEQ_LEN" }
max_new_tokens = { type = "uint32", default = 384, define = "QWEN3VL_MAX_NEW_TOKENS" }
prefill_chunk = { type = "uint32", default = 64, define = "QWEN3VL_PREFILL_CHUNK" }
prefill_min_chunk = { type = "uint32", default = 2, define = "QWEN3VL_PREFILL_MIN_CHUNK" }
vision_max_patches = { type = "uint32", default = 2048, define = "QWEN3VL_VISION_MAX_PATCHES" }
do_sample = { type = "bool", default = false, define = "QWEN3VL_DO_SAMPLE" }
top_k = { type = "uint32", default = 20, define = "QWEN3VL_TOP_K" }
top_p = { type = "float", default = 0.8, define = "QWEN3VL_TOP_P" }
temperature = { type = "float", default = 0.7, define = "QWEN3VL_TEMPERATURE" }
repetition_penalty = { type = "float", default = 1.0, define = "QWEN3VL_REPETITION_PENALTY" }
presence_penalty = { type = "float", default = 0.0, define = "QWEN3VL_PRESENCE_PENALTY" }
